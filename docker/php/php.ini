; Development defaults. Override per project as needed.
date.timezone = ${TZ}
memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 60
display_errors = On
error_reporting = E_ALL
expose_php = Off

opcache.enable = 1
; Re-check files on every request so code changes show up immediately.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
